<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <!-- Defesa em profundidade: a interface nao faz rede (fetch/XHR/WS bloqueados), so carrega img do jogo/data.
     Se algum dado escapar do escape, nao ha canal pra vazar as contas salvas. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://pokeascendedworld.com https://pokeidle.io https://poke.idleworld.online https://raw.githubusercontent.com https://pokexguides.com; font-src 'self' data:; connect-src 'self' ipc: http://ipc.localhost https://pokeascendedworld.com wss://pokeascendedworld.com https://api.github.com https://raw.githubusercontent.com; frame-src https://pokeascendedworld.com https://pokeidle.io https://poke.idleworld.online; child-src https://pokeascendedworld.com https://pokeidle.io https://poke.idleworld.online; base-uri 'none'; form-action 'none'">
  <script src="tauri-bridge.js"></script>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <title>PAW Nailo — Poke Ascended World</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      background: #0d1117;
      color: #e6edf3;
      font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }

    button,
    input {
      font-family: inherit;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    #topbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: #161b22;
      border-bottom: 1px solid #21262d;
      flex-shrink: 0;
    }

    #topbar .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 2.5px;
    }

    #topbar .logo svg {
      display: block;
    }

    #topbar .logo .ver {
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0;
      color: #6e7681;
      align-self: flex-end;
      padding-bottom: 1px;
    }

    button {
      background: #21262d;
      color: #e6edf3;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .2px;
      cursor: pointer;
    }

    button:hover {
      background: #30363d;
    }

    button.primary {
      background: #e3350d;
      border-color: #e3350d;
      color: #fff;
      font-weight: 600;
    }

    button.primary:hover {
      background: #f0491f;
    }

    button.on {
      background: #238636;
      border-color: #238636;
    }

    #refBtn {
      margin-left: 14px;
    }

    #donTop {
      margin-right: auto;
      margin-left: 12px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 600;
      background: #1f6f3d;
      border: 1px solid #2ea043;
      color: #fff;
    }

    #donTop:hover {
      background: #278a4b;
      border-color: #3fb950;
    }

    /* Dropdown de opções */
    #menuWrap {
      position: relative;
    }

    #menu {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      display: none;
      flex-direction: column;
      gap: 4px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 6px;
      min-width: 168px;
      z-index: 200;
      box-shadow: 0 10px 28px rgba(0, 0, 0, .45);
    }

    #menu.show {
      display: flex;
    }

    #menu button {
      width: 100%;
      text-align: left;
    }

    #langRow,
    #countRow {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    #langRow span,
    #countRow span {
      padding: 0 4px;
      white-space: nowrap;
    }

    #menu #langRow button,
    #menu #countRow button {
      width: auto;
      flex: 1;
      text-align: center;
    }

    #menu #countRow button {
      padding-left: 0;
      padding-right: 0;
      min-width: 24px;
    }

    #grid {
      flex: 1;
      display: grid;
      gap: 6px;
      padding: 6px;
      grid-template-columns: 1fr 1fr;
      grid-auto-rows: 1fr;
      position: relative;
      min-height: 0;
      transition: margin-left .18s ease;
    }

    /* painel aberto empurra o grid em vez de cobrir a coluna da esquerda */
    body.stats-open #grid {
      margin-left: var(--statsw, 350px);
    }

    #grid.count-1 {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
    }

    #grid.count-2 {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr;
    }

    #grid.count-3 {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }

    #grid.count-3 .panel:last-child {
      grid-column: 1 / -1;
    }

    /* 3o painel ocupa a linha de baixo inteira */
    #grid.count-4 {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }

    #grid.count-5,
    #grid.count-6,
    #grid.count-7,
    #grid.count-8 {
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 1fr);
    }

    #grid.count-9,
    #grid.count-10,
    #grid.count-11,
    #grid.count-12 {
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(3, minmax(250px, 1fr));
      overflow-y: auto;
    }

    #grid.count-13,
    #grid.count-14,
    #grid.count-15,
    #grid.count-16 {
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, minmax(230px, 1fr));
      overflow-y: auto;
    }

    #grid.one-col {
      grid-template-columns: 1fr !important;
      grid-template-rows: none;
    }

    #grid.one-col .panel {
      grid-column: auto !important;
    }

    #grid.one-row {
      grid-template-columns: none !important;
      grid-template-rows: 1fr !important;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
    }

    #grid.one-row .panel {
      grid-column: auto !important;
    }

    .panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 8px;
      overflow: hidden;
    }

    .panel.expanded {
      position: absolute;
      inset: 6px;
      z-index: 10;
    }

    .panel.off webview {
      visibility: hidden;
    }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px;
      background: #161b22;
      flex-shrink: 0;
      font-size: 12px;
    }

    /* a cor vem da conta (inline, igual ao modo Simples); o estado vira opacidade e anel */
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #8b949e;
      flex-shrink: 0;
      opacity: .35;
    }

    .dot.ok {
      opacity: 1;
      box-shadow: 0 0 6px currentColor;
    }

    .dot.err {
      opacity: 1;
      box-shadow: 0 0 0 2px #f85149;
    }

    .dot.off {
      opacity: .18;
    }

    .name {
      font-weight: 600;
      cursor: pointer;
    }

    .name input {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 4px;
      color: #e6edf3;
      font: inherit;
      padding: 0 5px;
      width: 150px;
    }

    .status {
      color: #8b949e;
      font-size: 11px;
      margin-right: auto;
    }

    .panel-header button {
      padding: 2px 8px;
      font-size: 11px;
    }

    .zpct {
      color: #8b949e;
      font-size: 11px;
      min-width: 32px;
      text-align: center;
      cursor: pointer;
    }

    .zpct:hover {
      color: #e6edf3;
    }

    webview {
      flex: 1;
      border: none;
      background: #000;
    }

    /* Proporção do jogo: o canvas dele é fixo em 1600x832 e é esticado por CSS pra preencher o
     container, com fatores x e y separados. Então em painel estreito e alto (3 contas lado a lado,
     por exemplo) a imagem distorce. Manter a proporção nativa corrige, ao custo de sobra escura. */
    body.prop-nat .panel>webview {
      flex: 0 0 auto;
      margin: auto;
    }

    /* o tamanho em px vem do JS: só ele sabe qual lado limita */

    /* Modal Contas */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    #overlay.show {
      display: flex;
    }

    #modal {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 18px 20px;
      width: 460px;
      max-width: 92vw;
    }

    #modal h2 {
      font-size: 15px;
      margin-bottom: 4px;
    }

    #modal p.hint {
      font-size: 11px;
      color: #8b949e;
      margin-bottom: 14px;
    }

    .acc-row {
      display: grid;
      grid-template-columns: 74px 1fr 1fr 30px;
      gap: 6px;
      margin-bottom: 8px;
      align-items: center;
    }

    .acc-row .acc-del {
      padding: 5px 0;
      background: #21262d;
    }

    .acc-row .acc-del:hover {
      background: #6e2634;
      border-color: #f85149;
    }

    .acc-row input {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      padding: 6px 8px;
      font-size: 12px;
      width: 100%;
    }

    .acc-row input:focus {
      outline: none;
      border-color: #e3350d;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 14px;
    }

    #tlOverlay,
    #dtOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    #tlOverlay.show,
    #dtOverlay.show {
      display: flex;
    }

    #tlModal,
    #dtModal {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 16px 18px;
      width: 680px;
      max-width: 96vw;
      max-height: 88vh;
      overflow-y: auto;
    }

    #tlModal h2,
    #dtModal h2 {
      font-size: 15px;
      margin-bottom: 2px;
    }

    #tlModal .hint,
    #dtModal .hint {
      font-size: 11px;
      color: #8b949e;
      margin-bottom: 6px;
    }

    #tlChips {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    #tlChips button,
    #dtCtl button {
      padding: 2px 8px;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: .4px;
    }

    #tlChips button.on,
    #dtCtl button.on {
      border-color: #e3350d;
      color: #fff;
    }

    .tl-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 6px;
      border-radius: 6px;
      font-size: 12px;
    }

    .tl-row:nth-child(odd) {
      background: #12171e;
    }

    .tl-row img {
      width: 30px;
      height: 30px;
      image-rendering: pixelated;
      flex: 0 0 30px;
    }

    .tl-cat {
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: .5px;
      border: 1px solid #f0883e;
      color: #f0883e;
      border-radius: 3px;
      padding: 0 3px;
      vertical-align: 1px;
    }

    .tl-cat.esp {
      border-color: #c297ff;
      color: #c297ff;
    }

    .tl-tier {
      flex: 0 0 20px;
      text-align: center;
      font-weight: 700;
      border-radius: 4px;
      font-size: 11px;
      padding: 1px 0;
    }

    .tl-info {
      flex: 1;
      min-width: 0;
    }

    .tl-sub {
      font-size: 10px;
      color: #8b949e;
    }

    .tl-num {
      flex: 0 0 40px;
      text-align: right;
      font-weight: 700;
      font-size: 13px;
    }

    .tl-h {
      font-size: 11px;
      color: #f2c665;
      text-transform: uppercase;
      letter-spacing: .6px;
      margin: 10px 0 4px;
    }

    /* Painel de resumo (barra lateral HUD) */
    #stats {
      position: fixed;
      left: 0;
      z-index: 150;
      width: 350px;
      max-width: 92vw;
      background: #0d1117;
      border-right: 1px solid #232a33;
      display: flex;
      flex-direction: column;
      transform: translateX(-100%);
      transition: transform .18s ease;
      box-shadow: 8px 0 40px rgba(0, 0, 0, .55);
    }

    #stats.show {
      transform: none;
    }

    #stats .sb-top {
      height: 3px;
      background: linear-gradient(90deg, #e3350d, #ff7a4d);
      flex-shrink: 0;
    }

    #stats .st-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 13px;
      background: #0b0f15;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #7d8590;
      flex-shrink: 0;
    }

    #stats .st-head .st-reset {
      margin-left: auto;
      padding: 2px 8px;
      font-size: 13px;
    }

    #stats .st-head .st-gear {
      margin-left: 5px;
      padding: 2px 8px;
      font-size: 14px;
    }

    #stats .st-head .st-gear.on {
      color: #e3350d;
    }

    #stats .st-head .st-x {
      margin-left: 5px;
      padding: 2px 9px;
      font-size: 13px;
    }

    #stats .st-tabs {
      display: flex;
      gap: 4px;
      padding: 8px 9px;
      background: #0b0f15;
      border-bottom: 1px solid #1c2229;
      flex-shrink: 0;
    }

    #stats .st-tab {
      flex: 1;
      min-width: 0;
      padding: 7px 4px;
      font-size: 11px;
      text-align: center;
      border-radius: 8px;
      background: #12171e;
      color: #7d8590;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      position: relative;
    }

    #stats .st-tab.on {
      color: #fff;
      background: #171f29;
    }

    #stats .st-tab.on {
      color: #fff;
    }

    #stats .st-tab.on::after {
      content: '';
      position: absolute;
      left: 22%;
      right: 22%;
      bottom: -1px;
      height: 2px;
      border-radius: 2px;
      background: var(--tabc, #e3350d);
    }

    #stats .st-body {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      margin-right: 9px;
    }

    #stats .st-body::-webkit-scrollbar {
      width: 9px;
    }

    #stats .st-body::-webkit-scrollbar-thumb {
      background: #30363d;
      border-radius: 5px;
    }

    #stats .st-empty {
      padding: 30px 18px;
      color: #6e7681;
      font-size: 12.5px;
      text-align: center;
      line-height: 1.7;
    }

    #stats .div {
      height: 1px;
      background: #1c2229;
    }

    #stats .pb {
      padding-bottom: 9px;
    }

    #stats .dsect {
      position: relative;
    }

    #stats .dsect .dgrip {
      position: absolute;
      left: 3px;
      top: 12px;
      color: #586069;
      font-size: 11px;
      letter-spacing: -2px;
      cursor: grab;
      opacity: 0;
      z-index: 4;
    }

    #stats .dsect:hover .dgrip {
      opacity: .8;
    }

    #stats .dsect .dhide {
      position: absolute;
      top: 7px;
      right: 8px;
      color: #6e7681;
      font-size: 11px;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      z-index: 4;
      padding: 2px 4px;
      border-radius: 5px;
      background: #0d1117;
    }

    #stats .dsect:hover .dhide {
      opacity: .65;
    }

    #stats .dsect .dhide:hover {
      opacity: 1;
      color: #f85149;
      background: #1c2229;
    }

    #stats .dsect.dragover {
      outline: 2px dashed rgba(227, 53, 13, .55);
      outline-offset: -2px;
      border-radius: 6px;
    }

    /* header do treinador */
    #stats .head {
      padding: 11px 15px 10px;
      position: relative;
    }

    #stats .idrow {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    #stats .ava {
      position: relative;
      flex: none;
      line-height: 0;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .5));
    }

    #stats .ava svg {
      width: 38px;
      height: 38px;
    }

    #stats .ava .lvl {
      position: absolute;
      bottom: -4px;
      right: -5px;
      background: #12171e;
      border: 1.5px solid #e3350d;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 7px;
    }

    #stats .nm {
      font-size: 15px;
      font-weight: 600;
      color: #f0f6fc;
      display: flex;
      align-items: center;
      gap: 7px;
      letter-spacing: .2px;
      min-width: 0;
    }

    #stats .nm .nmt {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #stats .vip {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .06em;
      color: #1a1400;
      background: #e3b341;
      padding: 2px 6px;
      border-radius: 5px;
      flex: none;
    }

    #stats .clan-emb {
      width: 20px;
      height: 20px;
      object-fit: contain;
      flex: none;
      vertical-align: middle;
    }

    #stats .loc {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #8b949e;
      margin-top: 3px;
    }

    #stats .idcol {
      min-width: 0;
      flex: 1;
    }

    #stats .goldline {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 5px;
    }

    #stats .goldline svg {
      width: 15px;
      height: 15px;
    }

    #stats .gv {
      font-size: 15px;
      font-weight: 700;
      color: #f2c665;
      font-variant-numeric: tabular-nums;
      letter-spacing: .3px;
    }

    #stats .gl {
      font-size: 9.5px;
      color: #6e7681;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    #stats .dia {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 4px;
      color: #8ab4ff;
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    #stats .dia svg {
      flex: none;
    }

    /* KPIs */
    #stats .kpis {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
    }

    #stats .kpi {
      padding: 10px 12px 9px;
      position: relative;
    }

    #stats .kpi+.kpi {
      border-left: 1px solid #171d25;
    }

    #stats .kpi .ac {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
    }

    #stats .kpi.g {
      background: #0e1912;
    }

    #stats .kpi.g .ac {
      background: #3fb950;
    }

    #stats .kpi.b {
      background: #0c1620;
    }

    #stats .kpi.b .ac {
      background: #58a6ff;
    }

    #stats .kpi.n {
      background: #0f141b;
    }

    #stats .kpi.n .ac {
      background: #7d8590;
    }

    #stats .kv {
      font-size: 18px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      letter-spacing: .2px;
    }

    #stats .kpi {
      padding: 11px 12px 10px;
    }

    #stats .kl {
      font-size: 9px;
      color: #6e7681;
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: .07em;
    }

    /* seções */
    #stats .sec {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 15px 6px;
    }

    #stats .sec .mk {
      width: 7px;
      height: 7px;
      border-radius: 2px;
      flex: none;
      transform: rotate(45deg);
    }

    #stats .sec .lb {
      font-size: 10.5px;
      color: #adbac7;
      text-transform: uppercase;
      letter-spacing: .09em;
      font-weight: 600;
    }

    #stats .sec .rt {
      margin-left: auto;
      font-size: 10.5px;
      color: #8b949e;
      font-variant-numeric: tabular-nums;
      background: #12171e;
      border: 1px solid #1c2229;
      padding: 1px 7px;
      border-radius: 6px;
    }

    #stats .r {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 4px 15px;
      font-size: 12.5px;
    }

    #stats .r .l {
      color: #8b949e;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #stats .r .v {
      font-variant-numeric: tabular-nums;

    /* Shiny CAPTURADO: o evento mais raro do jogo, então o aviso fica na tela até ser fechado */
    #shinyParty {
      position: fixed;
      top: 58px;
      left: 50%;
      /* abaixo da barra: nao cobre os botoes do app */
      transform: translateX(-50%);
      z-index: 900;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      pointer-events: none;
    }

    #shinyParty .sp {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 380px;
      max-width: 92vw;
      padding: 14px 18px;
      border-radius: 14px;
      border: 2px solid #f2c665;
      background: linear-gradient(135deg, #2a1033, #17202b 55%, #101820);
      box-shadow: 0 12px 40px rgba(0, 0, 0, .6), 0 0 0 1px rgba(247, 120, 186, .35), 0 0 26px rgba(247, 120, 186, .28);
      animation: spIn .32s ease-out, spGlow 1.9s ease-in-out 8 alternate;
    }

    @keyframes spIn {
      from {
        opacity: 0;
        transform: translateY(-14px) scale(.94);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes spGlow {
      from {
        box-shadow: 0 12px 40px rgba(0, 0, 0, .6), 0 0 0 1px rgba(247, 120, 186, .35), 0 0 18px rgba(247, 120, 186, .22);
      }

      to {
        box-shadow: 0 12px 40px rgba(0, 0, 0, .6), 0 0 0 1px rgba(242, 198, 101, .55), 0 0 34px rgba(242, 198, 101, .42);
      }
    }

    #shinyParty .sp-img {
      width: 76px;
      height: 76px;
      image-rendering: pixelated;
      object-fit: contain;
      flex: none;
      filter: drop-shadow(0 0 10px rgba(247, 120, 186, .55));

    /* Modo Cartas: dashboard ultra leve; o grid dos webviews fica vivo mas invisível */
    #cards {
      display: none;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      flex-direction: column;
      gap: 10px;
      padding: 10px 14px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    #cards::-webkit-scrollbar,
    body.cards-on #cards::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    body.cards-on #cards {
      display: flex;
    }

    body.cards-on #grid {
      position: absolute;
      left: 0;
      top: 0;
      width: 4px;
      height: 4px;
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
      padding: 0;
      gap: 0;
      margin: 0 !important;
    }

    body.stats-open #cards {
      margin-left: var(--statsw, 350px);
      transition: margin-left .18s ease;
    }

    /* grid de 12 colunas: cada seção tem posição (arraste o ⋮⋮) e largura (arraste a lateral direita) próprias */
    .cd-cols {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 10px;
      align-items: start;
    }

    .cd-it {
      position: relative;
      min-width: 0;
    }

    .cd-mv {
      position: absolute;
      top: 5px;
      right: 14px;
      z-index: 6;
      color: #586069;
      font-size: 12px;
      letter-spacing: -2px;
      cursor: grab;
      padding: 2px 6px;
      opacity: 0;
      transition: opacity .12s;
      user-select: none;
    }

    .cd-it:hover .cd-mv {
      opacity: 1;
    }

    .cd-mv:hover {
      color: #e3350d;
    }

    .cd-rz {
      position: absolute;
      top: 8px;
      bottom: 8px;
      right: -7px;
      width: 13px;
      cursor: ew-resize;
      z-index: 6;
    }

    .cd-rz::before {
      content: '';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      right: 5px;
      width: 3px;
      height: 30px;
      border-radius: 2px;
      background: transparent;
    }

    .cd-it:hover .cd-rz::before {
      background: #30363d;
    }

    .cd-rz:hover::before,
    .cd-it.rz-on .cd-rz::before {
      background: #e3350d;
    }

    .cd-rz2 {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: -7px;
      height: 13px;
      cursor: ns-resize;
      z-index: 6;
    }

    .cd-rz2::before {
      content: '';
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 5px;
      height: 3px;
      width: 34px;
      border-radius: 2px;
      background: transparent;
    }

    .cd-it:hover .cd-rz2::before {
      background: #30363d;
    }

    .cd-rz2:hover::before,
    .cd-it.rz-on .cd-rz2::before {
      background: #e3350d;
    }

    .cd-sec::-webkit-scrollbar,
    .cd-kpis::-webkit-scrollbar {
      width: 8px;
    }

    .cd-sec::-webkit-scrollbar-thumb,
    .cd-kpis::-webkit-scrollbar-thumb {
      background: #30363d;
      border-radius: 5px;

    .cd-it.cd-over {

    window.addEventListener('unhandledrejection', (e) => { try { window.pokeAPI.logError('interface-promise', (e.reason && e.reason.stack) || String(e.reason)); } catch { } });

    // Guarda-chuva do armazenamento local: nenhuma escrita pode derrubar a interface.
    // Quando a cota estoura (os logs de hunt/captura crescem com o uso), poda os logs grandes pela
    // metade e tenta de novo; se ainda assim falhar, desiste em silencio. Antes desta guarda, o
    // primeiro setItem do boot com a cota cheia impedia o app de abrir.
    const LS_PODAVEIS = ['huntLog', 'lifeCatch', 'lifeShiny', 'huntStats2'];
    function lsPoda() {
      let podou = false;
      LS_PODAVEIS.forEach(k => {
        try {
          const v = lsGet(k);
          if (!v || v.length < 2000) return;
          const arr = JSON.parse(v);
          if (Array.isArray(arr) && arr.length > 1) { localStorage.setItem(k, JSON.stringify(arr.slice(-Math.floor(arr.length / 2)))); podou = true; }
          // huntStats2 e OBJETO (hunt -> medicao): sem este ramo ele era apagado inteiro e o usuario
          // perdia toda a media medida de gold/h numa unica falha de cota
          else if (arr && typeof arr === 'object') {
            const ks = Object.keys(arr);
            if (ks.length > 1) { ks.slice(0, Math.floor(ks.length / 2)).forEach(k2 => { delete arr[k2]; }); localStorage.setItem(k, JSON.stringify(arr)); podou = true; }
            else { lsDel(k); podou = true; }
          }
          else { lsDel(k); podou = true; }
        } catch { try { lsDel(k); podou = true; } catch { } }
      });
      return podou;
    }
    function lsSet(k, v) {
      try { localStorage.setItem(k, v); return true; }
      catch (e) {
        try { if (lsPoda()) { localStorage.setItem(k, v); return true; } } catch { }
        try { window.pokeAPI && window.pokeAPI.logError && window.pokeAPI.logError('storage', 'sem espaco para ' + k); } catch { }
        return false;
      }
    }
    function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
    // JSON do disco pode ser null, numero ou lixo (JSON.parse("null") NAO lanca): sem estas guardas,
    // um valor torto em statsCfg/histDay derrubava o boot inteiro e o app nao abria.
    function lsObj(k) {
      try {
        const v = JSON.parse(lsGet(k) || "{}");
        if (!v || typeof v !== "object" || Array.isArray(v)) return {};
        // dado do disco pode trazer __proto__/constructor; com Object.assign isso trocaria o
        // prototipo do destino. Copia so chaves proprias e comuns.
        const o = {};
        for (const p in v) { if (p === "__proto__" || p === "constructor" || p === "prototype") continue; if (Object.prototype.hasOwnProperty.call(v, p)) o[p] = v[p]; }
        return o;
      } catch { return {}; }
    }
    function lsArr(k) { try { const v = JSON.parse(lsGet(k) || "[]"); return Array.isArray(v) ? v : []; } catch { return []; } }

    // Exporta duas planilhas: uma linha por hunt, e uma linha por item de cada hunt (com drop/kill)
    const csvCel = (v) => { v = String(v); if (/^[=+\-@]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; };

      ivEl.querySelectorAll('.iv-inp, .iv-st-l input').forEach(inp => inp.onchange = ivRecalcula);
      const hd = ivEl.querySelector('#ivDrag');
      if (hd) hd.addEventListener('mousedown', e => {
        if (e.target.closest('button')) return;
        const r = ivEl.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top;
        hd.classList.add('drag');
        const mv = ev => { ivPos = { l: ev.clientX - dx, t: ev.clientY - dy }; ivPosiciona(); };
        const up = () => { document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); hd.classList.remove('drag'); try { lsSet('ivCardPos', JSON.stringify(ivPos)); } catch { } };
        document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
      });
    }
    // recalcula no painel de origem: a fórmula é a de lá, o app só manda os valores editados
    function ivRecalcula() {
      const d = ivDados, w = webviews[ivFonte];
      if (!d || !w) return;
      const atuais = {}, bases = {};
      ivEl.querySelectorAll('[data-at]').forEach(i2 => atuais[i2.dataset.at] = +i2.value || 0);
      ivEl.querySelectorAll('[data-ba]').forEach(i2 => bases[i2.dataset.ba] = +i2.value || 0);
      const nv = +(ivEl.querySelector('#ivNv') || {}).value || 0, q = +(ivEl.querySelector('#ivQ') || {}).value || 0;
      const foco = document.activeElement && document.activeElement.id;
      const pedido = { pokemon: d.pokemon || { nome: d.nome, nivel: d.nivel, ivAtual: d.ivTotal, poder: d.poderJogo, tipos: d.tipos }, nivel: nv, qualidade: q, atuais, bases };
      try {
        w.executeJavaScript('window.__pgIv && window.__pgIv.calc(' + JSON.stringify(pedido) + ')').then(r => {
          if (!r) return;
          const d2 = ivSane(r); if (!d2) return; ivDados = d2; ivRender(); // r vem da pagina do jogo: sanea igual ao canal do console
          if (foco) { const el = ivEl.querySelector('#' + foco); if (el) el.focus(); }
        }).catch(() => { });
      } catch { }
    }
    // Saneador da entrada do canal. Qualquer script rodando na página do jogo pode emitir uma
    // mensagem marcada, e o renderer tem acesso às credenciais: então nada entra sem tipo, tamanho
    // e formato conferidos. URL de sprite passa por lista branca estrita (sem aspas, sem espaço),
    // senão dá pra escapar do atributo src e injetar um handler.
    const IV_SPR_OK = /^https:\/\/raw\.githubusercontent\.com\/PokeAPI\/sprites\/[\w./-]+\.(?:png|gif)$/;
    const ivTxt = (v, n) => String(v == null ? '' : v).slice(0, n || 40);
    const ivNum = (v, d) => { const x = +v; return Number.isFinite(x) ? x : (d || 0); };
    function ivSane(p) {
      if (!p || typeof p !== 'object' || Array.isArray(p)) return null;
      if (p.erro) return { erro: ivTxt(p.erro, 120), nome: ivTxt(p.nome) };
      const stats = {}, bases = {}, atuais = {};
      IVST.forEach(([k]) => { stats[k] = ivNum((p.ivs || {})[k]); bases[k] = ivNum((p.bases || {})[k]); atuais[k] = ivNum((p.atuais || {})[k]); });
      const cl = p.classificacao && typeof p.classificacao === 'object' ? p.classificacao : null;
      const spr = p.sprite && typeof p.sprite === 'object' ? p.sprite : {};
      const still = IV_SPR_OK.test(String(spr.still)) ? String(spr.still) : '';
      const anim = IV_SPR_OK.test(String(spr.anim)) ? String(spr.anim) : '';
      return {
        nome: ivTxt(p.nome), shiny: !!p.shiny,
        tipos: (Array.isArray(p.tipos) ? p.tipos : []).slice(0, 4).map(x => ivTxt(x, 20)),
        nivel: ivNum(p.nivel), qualidade: ivNum(p.qualidade),
        ivs: stats, bases, atuais,
        ivTotal: ivNum(p.ivTotal), ivMax: ivNum(p.ivMax, 192) || 192, ivMaxInd: ivNum(p.ivMaxInd, 32) || 32,
        percentual: Math.max(0, Math.min(100, ivNum(p.percentual))),
        classificacao: cl ? { texto: ivTxt(cl.texto, 30), descricao: ivTxt(cl.descricao, 140), cor: COR_OK.test(String(cl.cor)) ? String(cl.cor) : '#8b949e' } : null,
        sprite: still || anim ? { still: still || anim, anim: anim || still } : null,
        golpes: (Array.isArray(p.golpes) ? p.golpes : []).slice(0, 12).filter(g => g && typeof g === 'object').map(g => ({
          nome: ivTxt(g.nome, 30), tipo: ivTxt(g.tipo, 20), nivel: g.nivel == null ? null : ivNum(g.nivel),
          poder: g.poder == null ? null : ivNum(g.poder), dano: ivNum(g.dano), eff: ivNum(g.eff), ativo: !!g.ativo
        })),
        poder: ivNum(p.poder), poderJogo: ivNum(p.poderJogo),
        // volta pro painel no recálculo: só campos com tipo conferido
        pokemon: (() => { const q = p.pokemon && typeof p.pokemon === 'object' ? p.pokemon : {}; const o = { nome: ivTxt(q.nome), nivel: ivNum(q.nivel), ivAtual: ivNum(q.ivAtual), poder: ivNum(q.poder), qualidade: ivTxt(q.qualidade, 30), multiplicadorQualidade: ivNum(q.multiplicadorQualidade, 1), tipos: (Array.isArray(q.tipos) ? q.tipos : []).slice(0, 4).map(x => ivTxt(x, 20)) }; IVST.forEach(([k]) => o[k] = ivNum(q[k])); return o; })()
      };
    }
    // chamado pelo painel (via console-message) quando o mouse passa num pokémon
    function ivRecebe(i, payload) {
      const d = ivSane(payload);
      if (!d) return;
      ivDados = d; ivFonte = i;
      if (ivAberto) ivRender();
    }
    const ivsBtn = document.getElementById('ivsBtn');
    if (ivsBtn) ivsBtn.onclick = () => { ivAberto = !ivAberto; ivRender(); };

    // ----- Atalhos de teclado (letra solta) pros botoes principais (PR do israeltduarte) -----
    // So responde com o foco na interface: com o jogo focado o keydown nem chega aqui (contexto
    // separado). Ignora enquanto o usuario digita em campo, pra nao atropelar o texto.
    const TECLAS_ATALHO = {
      h: () => huntBtn.click(),                              // Hunt Analyzer
      l: () => cleanBtn.click(),                             // Limpar jogo
      c: () => cardsBtn.click(),                             // Simples
      e: () => ecoBtn.click(),                               // Eco
      a: () => alertBtn.click(),                             // Alertas
      g: () => document.getElementById('tierBtn').click(),   // Tierlist
      d: () => document.getElementById('dittoBtn').click(),  // Ditto
      r: () => document.getElementById('reloadAll').click(), // Atualizar tudo
      t: () => document.getElementById('accounts').click(),  // Treinadores
      m: () => dockBtn.click(),                              // Menu do jogo (igual F2)
      s: () => { if (typeof window.toggleGameMuted === 'function') window.toggleGameMuted(); }, // Som/Mudo
      o: () => menu.classList.toggle('show')                 // Opcoes
    };
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.altKey || e.metaKey) return; // combos (Ctrl+M etc) seguem intactos
      if (document.querySelector('#overlay.show')) return; // janela aberta: digitar antes de clicar no campo recarregava os paineis ('r') e desligava os alertas ('a')
      const ae = document.activeElement;
      if (ae && (ae.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))) return;
      const fn = TECLAS_ATALHO[String(e.key || '').toLowerCase()];
      if (!fn) return;
      e.preventDefault();
      try { fn(); } catch { }
    });

// ----- Init -----
    (async () => {
      try { accounts = normalize(await window.pokeAPI.loadCreds()); }
      catch { accounts = normalize([]); }
      count = getDesiredCount(accounts);
      if (typeof syncCountButtons === 'function') syncCountButtons();
      if (cardsOn) {
        document.documentElement.classList.add('cards-on');
        document.body.classList.add('cards-on');
        cardsBtn.classList.add('on');
      }
      build();
      applyLang(); // aplica idioma na interface e ja chama Eco/Chat/Awake
      applyStats(); // restaura o painel de resumo se estava aberto
      applyCards(); // restaura o modo cartas se estava ligado
    })();
  </script>
  <script src="src/ui/pokeleaf-shell.js"></script>
</body>
